<section id="cta" class="bg-noise relative overflow-hidden bg-band py-[110px] text-white md:py-[140px]">
      <div aria-hidden="true" class="absolute inset-0">
        <div class="animate-aurora absolute top-1/2 left-1/3 h-[70vh] w-[60vw] -translate-x-1/2 -translate-y-1/2 rounded-full bg-forest-600/25 blur-[150px]"></div>
        <div class="animate-pulse-soft absolute top-[30%] right-[10%] h-64 w-[420px] rounded-full bg-forest-500/12 blur-[110px]"></div>
        <div class="bg-grid-dark absolute inset-0 [mask-image:radial-gradient(ellipse_at_center,black_20%,transparent_65%)]"></div>
      </div>
      <div class="container-site relative grid items-center gap-14 lg:grid-cols-[1fr_1.05fr]">
        <div class="text-center lg:text-left">
          <div appReveal>
            <h2 class="font-heading text-[clamp(38px,5.2vw,64px)] leading-[1.05] font-semibold tracking-tight text-balance">
              {{ 'cta.title1' | t }}<br />
              <span class="text-gradient-gold animate-shimmer">{{ 'cta.title2' | t }}</span>
            </h2>
          </div>
          <div appReveal [delay]="150">
            <p class="mx-auto mt-7 max-w-xl text-lg leading-relaxed text-cream lg:mx-0">
              {{ 'cta.sub' | t }}
            </p>
          </div>
          <div appReveal [delay]="300">
            <div class="mt-10 flex justify-center lg:justify-start">
              <a
                routerLink="/contact"
                class="group font-labels inline-flex items-center justify-center gap-2 rounded-full font-semibold tracking-wide transition-[background-position,background-color,border-color,box-shadow] duration-500 px-9 py-4 text-[16px] bg-gradient-to-r bg-cream text-forest-800 shadow-[0_8px_30px_-6px_rgba(10,46,24,0.35)] hover:bg-right"
                tabindex="0"
              >
                {{ 'cta.talk' | t }}
                <app-icon name="arrow-right" class="size-4 transition-transform duration-300 group-hover:translate-x-1" />
              </a>
            </div>
          </div>
          <div appReveal [delay]="420">
          <ul class="mt-12 flex flex-wrap items-center justify-center gap-x-9 gap-y-4 lg:justify-start">
            @for (badge of badges; track badge.labelKey) {
              <li class="flex items-center gap-2 text-[14px] text-cream">
                <app-icon [name]="badge.icon" class="size-4 text-cream" />{{ badge.labelKey | t }}
              </li>
            }
          </ul>
          </div>
        </div>
        <div appReveal direction="right" [delay]="200">
          <div class="relative mx-auto w-full max-w-[560px] lg:max-w-none">
            <div aria-hidden="true" class="animate-pulse-soft absolute inset-x-[2%] top-[18%] bottom-[8%] rounded-full bg-forest-400/12 blur-[80px]"></div>
            <div class="relative">
              <img
                [alt]="'cta.imgAlt' | t"
                loading="lazy"
                width="1536"
                height="1024"
                decoding="async"
                class="h-auto w-full"
                src="assets/ellie-cta-green.webp"
              />
              <div class="absolute inset-0 [container-type:inline-size]">
                <div aria-hidden="true" class="absolute inset-0">
                  <div class="absolute overflow-hidden rounded-[1.6cqw] border border-forest-200/80 bg-white/95 shadow-[0_1.6cqw_4cqw_-1.2cqw_rgba(18,69,41,0.35)] left-[39.5%] top-[12%] flex w-[20%] -rotate-2 items-center gap-[1cqw] px-[1.4cqw] py-[1.2cqw]">
                    <app-icon name="dna" class="size-[2.2cqw] shrink-0 text-forest-600" />
                    <p class="text-[1.3cqw] font-semibold whitespace-nowrap text-slate-700">{{ 'cta.genetic' | t }}</p>
                  </div>
                  <div class="absolute overflow-hidden rounded-[1.6cqw] border border-forest-200/80 bg-white/95 shadow-[0_1.6cqw_4cqw_-1.2cqw_rgba(18,69,41,0.35)] left-[34.5%] top-[34%] flex w-[24.5%] -rotate-2 items-center gap-[1.2cqw] px-[1.5cqw] py-[1.4cqw]">
                    <span class="grid size-[4cqw] shrink-0 place-items-center rounded-[1cqw] bg-forest-100 text-forest-700">
                      <app-icon name="stethoscope" class="size-[2.2cqw]" />
                    </span>
                    <span class="min-w-0">
                      <p class="text-[1.9cqw] leading-tight font-bold text-slate-800">CCM</p>
                      <p class="text-[1.25cqw] leading-snug whitespace-nowrap text-slate-500">{{ 'cta.ccmSub' | t }}</p>
                    </span>
                  </div>
                  <div class="absolute overflow-hidden rounded-[1.6cqw] border border-forest-200/80 bg-white/95 shadow-[0_1.6cqw_4cqw_-1.2cqw_rgba(18,69,41,0.35)] left-[40.5%] top-[44.5%] w-[17.5%] -rotate-3 px-[1.5cqw] py-[1.3cqw]">
                      <p class="flex items-center gap-[0.8cqw] text-[1.55cqw] font-semibold text-slate-700">
                        <app-icon name="pill" class="size-[1.8cqw] shrink-0 text-forest-600" />{{ 'cta.med' | t }}
                      </p>
                    <div class="mt-[0.9cqw] h-[0.9cqw] overflow-hidden rounded-full bg-forest-100">
                      <div class="h-full w-[97%] rounded-full bg-gradient-to-r from-forest-500 to-forest-400"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

<section class="relative overflow-hidden py-[100px] md:py-[140px] bg-forest-50 text-ink">
      <div class="container-site">
        <div class="mb-16 max-w-3xl md:mb-20 mx-auto text-center max-w-none">
          <div appReveal>
            <h2 class="font-heading text-4xl leading-[1.08] font-semibold tracking-tight text-balance md:text-[56px] text-forest-950">
              <span class="block">{{ 'faq.title' | t }}</span>
            </h2>
          </div>
        </div>
        <div class="mx-auto max-w-3xl">
          @for (item of faqs; track item.qKey; let i = $index) {
            <div appReveal [delay]="i * 90">
              <div class="border-b transition-colors duration-500" [class.border-forest-700/60]="open() === i" [class.border-forest-800/12]="open() !== i">
                <button
                  type="button"
                  [attr.aria-expanded]="open() === i"
                  [attr.aria-controls]="'faq-panel-' + i"
                  [attr.id]="'faq-button-' + i"
                  class="group flex w-full items-center justify-between gap-6 py-6 text-left"
                  (click)="toggle(i)"
                >
                  <span
                    class="font-heading text-[17.5px] font-semibold tracking-tight transition-colors duration-300 md:text-[19px]"
                    [class.text-forest-600]="open() === i"
                    [class.text-forest-950]="open() !== i"
                    [class.group-hover:text-forest-700]="true"
                  >
                    {{ item.qKey | t }}
                  </span>
                  @if (open() === i) {
                    <span class="grid size-8 shrink-0 place-items-center rounded-full transition-colors duration-300 bg-forest-700 text-white">
                      <app-icon name="minus" class="size-4" />
                    </span>
                  } @else {
                    <span class="grid size-8 shrink-0 place-items-center rounded-full transition-colors duration-300 border border-forest-800/25 text-forest-800/60 group-hover:border-forest-700/50 group-hover:text-forest-700">
                      <app-icon name="plus" class="size-4" />
                    </span>
                  }
                </button>
                <div
                  [attr.id]="'faq-panel-' + i"
                  role="region"
                  [attr.aria-labelledby]="'faq-button-' + i"
                  class="faq-panel"
                  [class.open]="open() === i"
                >
                  <div>
                    <p class="max-w-2xl pb-7 text-[16px] leading-relaxed text-ink">{{ item.aKey | t }}</p>
                  </div>
                </div>
              </div>
            </div>
          }
        </div>
      </div>
    </section>

<div
  class="fixed inset-x-0 top-0 z-50 flex justify-center px-4 pt-4 transition-transform duration-500 ease-[cubic-bezier(0.22,0.61,0.25,1)]"
  [class.-translate-y-28]="hidden()"
>
  <nav
    aria-label="Main navigation"
    class="flex w-full max-w-[1180px] items-center justify-between rounded-2xl border px-5 py-3 transition-all duration-500 md:px-7"
    [class.border-transparent]="!solidHeader()"
    [class.bg-transparent]="!solidHeader()"
    [class.bg-forest-900/92]="solidHeader()"
    [class.border-white/12]="solidHeader()"
    [class.backdrop-blur-xl]="solidHeader()"
    [class.shadow-[0_16px_50px_-16px_rgba(15,58,34,0.7)]]="solidHeader()"
  >

    <!-- LOGO -->
    <button
      type="button"
      class="group flex items-center"
      [attr.aria-label]="'nav.homeAria' | t"
      (click)="goToSection('hero')"
    >
      <img
        src="assets/logo-mark.webp"
        alt="eirion.ai"
        width="448"
        height="123"
        class="h-9 w-auto"
      />
    </button>

    <!-- DESKTOP MENU -->
    <ul class="hidden items-center gap-8 lg:flex">
      @for (link of links; track link.href) {
        <li>
          <button
            type="button"
            (click)="goToSection(link.section)"
            class="group font-labels relative py-2 text-[14px] font-medium text-ink transition-colors hover:text-white"
          >
            {{ link.labelKey | t }}

            <span
              class="absolute inset-x-0 -bottom-0.5 h-px origin-left scale-x-0 bg-gradient-to-r from-forest-200 to-forest-400 transition-transform duration-300 group-hover:scale-x-100"
            ></span>
          </button>
        </li>
      }
    </ul>

    <!-- RIGHT SIDE -->
    <div class="flex items-center gap-3">

      <!-- LOGIN -->
      <a
        href="https://app.eirion.ai/auth/login"
        class="font-labels hidden text-[14px] font-medium text-ink transition-colors hover:text-white md:block"
      >
        {{ 'nav.login' | t }}
      </a>

      <!-- MEET ELLIE -->
      <button
        type="button"
        (click)="goToSection('cta')"
        class="font-labels hidden rounded-full bg-cream px-5 py-2.5 text-[14px] font-semibold text-forest-950 shadow-[0_6px_24px_-6px_rgba(10,46,24,0.4)] transition-all duration-300 hover:scale-105 md:block"
      >
        {{ 'nav.meetEllie' | t }}
      </button>

      <!-- LANGUAGE -->
      <div class="relative">
        <button
          type="button"
          [attr.aria-expanded]="langOpen()"
          [attr.aria-label]="'nav.language' | t"
          (click)="toggleLang()"
          class="grid size-10 place-items-center rounded-xl border border-white/15 text-cream transition-colors hover:border-cream/40 hover:text-white"
        >
          <app-icon
            name="globe"
            [size]="18"
            class="size-[18px]"
          />
        </button>

        @if (langOpen()) {
          <div
            class="absolute right-0 top-[calc(100%+10px)] z-50 max-h-[min(60vh,380px)] w-48 overflow-y-auto rounded-2xl border border-white/12 bg-forest-900/96 p-2 shadow-2xl backdrop-blur-xl"
          >
            <ul class="flex flex-col">
              @for (lang of i18n.languages; track lang.code) {
                <li>
                  <button
                    type="button"
                    (click)="pickLang(lang.code)"
                    class="font-labels flex w-full items-center justify-between gap-2 rounded-lg px-3 py-2.5 text-left text-[14px] font-medium transition-colors hover:bg-white/5"
                    [class.text-white]="i18n.lang() === lang.code"
                    [class.text-cream]="i18n.lang() !== lang.code"
                  >
                    <span>{{ lang.native }}</span>

                    @if (i18n.lang() === lang.code) {
                      <app-icon
                        name="check"
                        [size]="14"
                        class="size-3.5 shrink-0 text-forest-300"
                      />
                    }
                  </button>
                </li>
              }
            </ul>
          </div>
        }
      </div>

      <!-- MOBILE MENU BUTTON -->
      <button
        type="button"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="
          (menuOpen() ? 'nav.closeMenu' : 'nav.openMenu') | t
        "
        class="grid size-10 place-items-center rounded-xl border border-white/15 text-white lg:hidden"
        (click)="toggleMenu()"
      >
        @if (menuOpen()) {
          <app-icon
            name="x"
            [size]="20"
            class="size-5"
          />
        } @else {
          <app-icon
            name="menu"
            [size]="20"
            class="size-5"
          />
        }
      </button>
    </div>
  </nav>

  <!-- MOBILE MENU -->
  @if (menuOpen()) {
    <div
      class="mobile-menu-enter absolute inset-x-4 top-[84px] rounded-2xl border border-white/12 bg-forest-900/96 p-6 shadow-2xl backdrop-blur-xl lg:hidden"
    >
      <ul class="flex flex-col gap-1">

        @for (link of links; track link.href) {
          <li>
            <button
              type="button"
              (click)="goToSection(link.section)"
              class="font-labels block w-full rounded-lg px-3 py-3 text-left text-[16px] font-medium text-cream transition-colors hover:bg-white/5 hover:text-white"
            >
              {{ link.labelKey | t }}
            </button>
          </li>
        }

        <!-- MOBILE LOGIN + MEET ELLIE -->
        <li class="mt-3 border-t border-white/10 pt-4">

          <a
            href="https://app.eirion.ai/auth/login"
            class="font-labels mb-2 block rounded-lg px-3 py-3 text-[16px] font-medium text-ink transition-colors hover:bg-white/5 hover:text-white"
          >
            {{ 'nav.login' | t }}
          </a>

          <button
            type="button"
            (click)="goToSection('cta')"
            class="font-labels block w-full rounded-full bg-cream px-5 py-3 text-center text-[15px] font-semibold text-forest-950"
          >
            {{ 'nav.meetEllie' | t }}
          </button>

        </li>
      </ul>
    </div>
  }
</div>

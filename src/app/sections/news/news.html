<section id="news" class="relative overflow-hidden py-[100px] md:py-[140px] bg-cream text-ink">
      <div class="container-site">
        <div class="mb-16 max-w-3xl md:mb-20 mx-auto text-center">
          <div appReveal>
            <h2 class="font-heading text-4xl leading-[1.08] font-semibold tracking-tight text-balance md:text-[56px] text-forest-950">
              <span class="block">{{ 'news.title1' | t }}</span><span class="block">{{ 'news.title2' | t }}</span>
            </h2>
          </div>
        </div>
        <div class="grid gap-7 md:grid-cols-3">
          @for (card of cards; track card.titleKey; let i = $index) {
            <div appReveal [delay]="i * 140">
              <div class="group relative overflow-hidden rounded-3xl border border-forest-800/10 bg-white shadow-[0_18px_50px_-24px_rgba(18,69,41,0.18)] h-full p-8 md:p-9" (mousemove)="onCardMove($event)">
                <div
                  aria-hidden="true"
                  class="pointer-events-none absolute inset-0 opacity-0 transition-opacity duration-500 group-hover:opacity-100"
                  [style.background]="'radial-gradient(420px circle at ' + spotX() + 'px ' + spotY() + 'px, rgba(22,163,74,0.10), transparent 72%)'"
                ></div>
                <div class="relative">
                  <div class="flex items-center justify-between">
                    <span class="grid size-12 place-items-center rounded-2xl bg-forest-100 text-forest-700 transition-transform duration-500 group-hover:scale-110 group-hover:rotate-3">
                      <app-icon [name]="card.icon" [size]="20" class="size-5" />
                    </span>
                    <span class="font-stats text-5xl font-semibold text-forest-950/8 transition-colors duration-500 group-hover:text-forest-500/25">0{{ i + 1 }}</span>
                  </div>
                  <h3 class="font-heading mt-6 text-[21px] font-semibold tracking-tight text-forest-950">{{ card.titleKey | t }}</h3>
                  <p class="mt-3 text-[15.5px] leading-relaxed text-ink/65">{{ card.descKey | t }}</p>
                </div>
              </div>
            </div>
          }
        </div>
        <div appReveal [delay]="200">
          <div class="relative mt-20 overflow-hidden rounded-[32px] bg-forest-800 px-8 py-14 md:px-14">
            <div class="bg-grid-dark absolute inset-0 [mask-image:radial-gradient(ellipse_at_center,black_30%,transparent_80%)]" aria-hidden="true"></div>
            <div aria-hidden="true" class="animate-pulse-soft absolute top-0 left-1/2 h-52 w-[560px] -translate-x-1/2 rounded-full bg-forest-500/18 blur-[100px]"></div>
            <div class="relative grid gap-12 text-center sm:grid-cols-3">
              @for (stat of stats; track stat.labelKey; let i = $index) {
                <div>
                  <p class="font-stats text-6xl font-semibold text-white md:text-7xl">
                    <span><span appCounter [value]="stat.value" [suffix]="stat.suffix"></span></span>
                  </p>
                  <p class="font-labels mt-3 text-[14px] font-medium tracking-[0.12em] text-cream uppercase">{{ stat.labelKey | t }}</p>
                </div>
              }
            </div>
          </div>
        </div>
      </div>
    </section>
  `
